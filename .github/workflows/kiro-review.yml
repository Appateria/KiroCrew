name: Kiro Headless Review

# Runs Kiro CLI in headless mode against a pull request and posts the result
# back as a PR comment. Fires automatically when a PR is opened/updated, and
# can also be triggered manually on any branch via the Actions tab.
#
# Setup: store your Kiro API key (starts with "ksk_") as a repository secret
# named KIRO_API_KEY (Settings -> Secrets and variables -> Actions).

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      prompt:
        description: "Prompt to run against the checked-out branch"
        required: false
        default: "Review the changes on this branch for bugs, security issues, and code quality. Summarize findings as a markdown list grouped by severity."

# Least-privilege: read the repo, write PR comments only.
permissions:
  contents: read
  pull-requests: write

# Avoid piling up runs on rapid pushes to the same PR/branch.
concurrency:
  group: kiro-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kiro-review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR/branch
        uses: actions/checkout@v4
        with:
          # Full history so Kiro can diff against the base branch.
          fetch-depth: 0

      - name: Install Kiro CLI
        run: |
          curl -fsSL https://cli.kiro.dev/install | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the review prompt
        id: prompt
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          MANUAL_PROMPT: ${{ github.event.inputs.prompt }}
        run: |
          if [ -n "$MANUAL_PROMPT" ]; then
            PROMPT="$MANUAL_PROMPT"
          else
            # For a PR, focus Kiro on the diff against the base branch.
            PROMPT="Review the changes in this pull request against the '${BASE_REF}' branch. \
          Inspect the diff (e.g. \`git diff origin/${BASE_REF}...HEAD\`), then report bugs, \
          security issues, and code-quality concerns as a concise markdown list grouped by \
          severity (Critical/High/Medium/Low). If nothing significant stands out, say so."
          fi
          # Pass the prompt to later steps via a file (safe for multiline / quotes).
          printf '%s' "$PROMPT" > "$RUNNER_TEMP/prompt.txt"

      - name: Run Kiro headless
        id: kiro
        env:
          KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
        run: |
          if [ -z "$KIRO_API_KEY" ]; then
            echo "::error::KIRO_API_KEY secret is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          PROMPT="$(cat "$RUNNER_TEMP/prompt.txt")"
          OUT="$RUNNER_TEMP/kiro-output.md"

          # --no-interactive: headless, no terminal session.
          # --trust-tools=read,grep: read-only tools only (no file edits / shell writes).
          set +e
          kiro-cli chat --v3 --no-interactive --trust-tools=read,grep "$PROMPT" | tee "$OUT"
          STATUS=${PIPESTATUS[0]}
          set -e

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" -ne 0 ]; then
            echo "::warning::kiro-cli exited with status $STATUS"
          fi

      - name: Post review as a PR comment
        # Only when triggered by a pull_request event (a PR number exists).
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = `${process.env.RUNNER_TEMP}/kiro-output.md`;
            let body;
            try {
              body = fs.readFileSync(path, 'utf8').trim();
            } catch (e) {
              body = '';
            }
            if (!body) {
              body = '_Kiro produced no output for this run._';
            }
            const marker = '<!-- kiro-headless-review -->';
            const header = `${marker}\n### 🤖 Kiro headless review\n\n`;
            const footer = `\n\n<sub>Generated by \`kiro-cli chat --no-interactive\` — commit \`${context.sha.slice(0, 7)}\`</sub>`;
            const commentBody = header + body + footer;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            // Reuse a single comment per PR (update in place) instead of spamming.
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: commentBody });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: commentBody });
            }

      - name: Write run summary
        if: ${{ always() }}
        run: |
          {
            echo "### 🤖 Kiro headless review"
            echo ""
            if [ -f "$RUNNER_TEMP/kiro-output.md" ]; then
              cat "$RUNNER_TEMP/kiro-output.md"
            else
              echo "_No output produced._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
